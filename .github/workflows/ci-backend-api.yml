name: CI Backend API

on:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: tourism_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/api/requirements.txt
            backend/api/requirements-test.txt

      - name: Install dependencies
        working-directory: backend/api
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        working-directory: backend/api
        env:
          # PostgreSQL disponible pour les futurs tests d'intégration.
          # Les tests actuels utilisent SQLite (conftest.py), donc cette URL
          # n'est pas encore utilisée mais est prête à l'emploi.
          DATABASE_URL: postgresql://postgres:ci_test_password@localhost:5432/tourism_test_db
          SECRET_KEY: ci-test-secret-key-not-used-in-prod
        run: pytest tests/ -v
