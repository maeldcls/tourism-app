name: CI Frontend

on:
  workflow_call:

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/tourism-frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend/tourism-frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend/tourism-frontend
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build production bundle
        working-directory: frontend/tourism-frontend
        run: npm run build
