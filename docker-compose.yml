services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: tourism_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./backend/api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db

  ai:
    build: ./backend/ai
    ports:
      - "8001:8001"

  frontend:
    build: ./frontend/tourism-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
